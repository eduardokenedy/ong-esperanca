<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - ONG Esperança</title>
  <!-- Como o cadastro.html está dentro da pasta /html, o CSS precisa subir um nível -->
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header>
    <h1>Cadastro de Voluntários</h1>
    <nav>
      <ul>
        <!-- Links continuam dentro da pasta /html -->
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form>
      <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <label for="cep">CEP:</label>
        <input type="text" id="cep" name="cep" maxlength="9" pattern="\d{5}-\d{3}" placeholder="00000-000" required>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" required>

        <label for="estado">Estado:</label>
        <input type="text" id="estado" name="estado" maxlength="2" required>
      </fieldset>

      <fieldset>
        <legend>Contato</legend>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(00) 00000-0000" required>
      </fieldset>

      <button type="submit">Enviar Cadastro</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 ONG Esperança - Todos os direitos reservados.</p>
  </footer>

  <!-- Script de máscaras para os campos -->
  <script>
    function aplicarMascara(input, mascara) {
      input.addEventListener('input', () => {
        let valor = input.value.replace(/\D/g, ''); // remove tudo que não for número
        let resultado = '';
        let pos = 0;

        for (let i = 0; i < mascara.length; i++) {
          if (mascara[i] === '#') {
            if (valor[pos]) {
              resultado += valor[pos++];
            } else {
              break;
            }
          } else {
            resultado += mascara[i];
          }
        }
        input.value = resultado;
      });
    }

    // Máscaras específicas
    aplicarMascara(document.getElementById('cpf'), '###.###.###-##');
    aplicarMascara(document.getElementById('cep'), '#####-###');
    aplicarMascara(document.getElementById('telefone'), '(##) #####-####');
  </script>

  <!-- Script de navegação SPA -->
  <script src="../js/modules/navegacao.js"></script>
  <script src="../js/modules/eventosFormulario.js"></script>
  <script src="../js/modules/validacaoFormulario.js"></script>
  <script src="../js/modules/persistenciaFormulario.js"></script>
</body>
</html>
