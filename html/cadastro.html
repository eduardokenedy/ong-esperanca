<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - ONG Esperança</title>
  <!-- Como o cadastro.html está dentro da pasta /html, o CSS precisa subir um nível -->
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header>
    <h1>Cadastro de Voluntários</h1>
    <nav>
      <ul>
        <!-- Links continuam dentro da pasta /html -->
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form id="formulario-voluntario" novalidate>
      <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" autocomplete="name" aria-describedby="erro-nome" required>
        <span class="mensagem-erro" id="erro-nome" aria-live="polite"></span>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" aria-describedby="erro-cpf" required>
        <span class="mensagem-erro" id="erro-cpf" aria-live="polite"></span>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" autocomplete="email" aria-describedby="erro-email" required>
        <span class="mensagem-erro" id="erro-email" aria-live="polite"></span>

        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" autocomplete="bday" aria-describedby="erro-nascimento" required>
        <span class="mensagem-erro" id="erro-nascimento" aria-live="polite"></span>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <label for="cep">CEP:</label>
        <input type="text" id="cep" name="cep" inputmode="numeric" autocomplete="postal-code" maxlength="9" placeholder="00000-000" aria-describedby="erro-cep" required>
        <span class="mensagem-erro" id="erro-cep" aria-live="polite"></span>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" autocomplete="address-level2" aria-describedby="erro-cidade" required>
        <span class="mensagem-erro" id="erro-cidade" aria-live="polite"></span>

        <label for="estado">Estado:</label>
        <input type="text" id="estado" name="estado" autocomplete="address-level1" maxlength="2" pattern="[A-Za-z]{2}" placeholder="PR" aria-describedby="erro-estado" required>
        <span class="mensagem-erro" id="erro-estado" aria-live="polite"></span>
      </fieldset>

      <fieldset>
        <legend>Contato</legend>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" autocomplete="tel" inputmode="tel" maxlength="15" placeholder="(00) 00000-0000" aria-describedby="erro-telefone" required>
        <span class="mensagem-erro" id="erro-telefone" aria-live="polite"></span>
      </fieldset>

      <button type="submit">Enviar Cadastro</button>
    </form>
    <p id="mensagem-formulario" class="mensagem-formulario" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <p>&copy; 2026 ONG Esperança - Todos os direitos reservados.</p>
  </footer>

  <!-- Máscaras de entrada para CPF, CEP e telefone. -->
  <script>
    function aplicarMascara(input, mascara) {
      input.addEventListener('input', () => {
        let valor = input.value.replace(/\D/g, ''); // remove tudo que não for número
        let resultado = '';
        let pos = 0;

        for (let i = 0; i < mascara.length; i++) {
          if (mascara[i] === '#') {
            if (valor[pos]) {
              resultado += valor[pos++];
            } else {
              break;
            }
          } else {
            resultado += mascara[i];
          }
        }
        input.value = resultado;
      });
    }

    // Máscaras específicas
    aplicarMascara(document.getElementById('cpf'), '###.###.###-##');
    aplicarMascara(document.getElementById('cep'), '#####-###');
    const telefone = document.getElementById('telefone');
    telefone.addEventListener('input', () => {
      const numeros = telefone.value.replace(/\D/g, '').slice(0, 11);
      const mascaraTelefone = numeros.length > 10 ? '(##) #####-####' : '(##) ####-####';
      let posicao = 0;
      telefone.value = mascaraTelefone.replace(/#/g, () => numeros[posicao++] || '').replace(/[-\s(]+$/, '');
    });
  </script>

  <!-- Os scripts do formulário são separados por responsabilidade. -->
  <script src="js/modules/navegacao.js"></script>
  <script src="js/modules/eventosFormulario.js"></script>
  <script src="js/modules/validacaoFormulario.js"></script>
  <script src="js/modules/persistenciaFormulario.js"></script>
</body>
</html>
